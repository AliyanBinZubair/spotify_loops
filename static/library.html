<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Library</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body class="dark">
    <div class="app-shell">
        <header class="top-bar">
            <img src="/static/music_player_icon.png" class="top-logo" alt="Logo">
            <h1>Your Library</h1>
        </header>

        <section class="add-song-card">
            <input type="text" id="song-title" placeholder="Song title">
            <input type="text" id="song-url" placeholder="Song URL">
            <button id="add-song-btn">Add Song</button>
            <p id="add-message"></p>
        </section>
        
        <section id="song-list" class="track-list"></section>
        <audio id="player"></audio>
    </div>
    <div id="mini-player" class="mini-player hidden">
        <!-- Row 1: Left Song Details & Right Control Panel Grouped Center -->
        <div class="player-top-row">
            <div class="mini-player-info">
                <div id="now-playing-title" class="mini-title">—</div>
            </div>
            
            <div class="loop-controls">
                <button id="loop" title="Enable repeat" >
                    <svg class="loop-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Square loop with rounded corners -->
                        <path d="M17 17H7a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v4a3 3 0 0 1-2.12 2.86" />
                        <!-- Arrowhead pointing to the right, barely missing the tail -->
                        <polyline points="16 4 19 7 16 10" />
                    </svg>
                </button>
                <button id="Previous-song" title="Previous song">⏮</button>
                <div class="mini-controls">
                    <button id="play-pause-btn">▶</button>
                </div>
                <button id="Next-song" title="Next song">⏭</button>
                <button id="toggle-segment-btn" title="short loop" aria-label="Repeat" class="repeat">
                    <svg class="repeat-icon" viewBox="0 0 24 24">
                        <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4z"/>
                        <path d="M6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
                    </svg>
                </button>
            </div>
            
            <!-- Right Empty Space balancing the title width so controls stay dead-center -->
            <div class="player-right-spacer"></div>
        </div>

        <!-- Row 2: Bottom Progress Timeline -->
        <div class="player-bottom-row">
            <!-- Added id="current-time-text" -->
            <span id="current-time-text" class="time-stamp current-time">0:00</span>
        
            <div id="progress-bar" class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
                <div id="loop-region" class="loop-region hidden">
                    <div id="loop-handle-left" class="loop-handle left"></div>
                    <div class="loop-center-content">
                        <div id="center-fill" class="loop-center-fill"></div>
                    </div>
                    <div id="loop-handle-right" class="loop-handle right"></div>
                </div>
            </div>
            
            <!-- Added id="total-duration-text" -->
            <span id="total-duration-text" class="time-stamp total-time">0:00</span>
        </div>
    </div>
    
    <nav class="bottom-nav">
        <button class="nav-item active">Home</button>
        <button class="nav-item" id="logout-btn">logout</button>
        <button class="nav-item" id="settings-btn">Settings ⚙</button>
    </nav>
    <div id="settings-overlay" class="settings-overlay hidden">
        <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-header">
                <h2 id="settings-title">Settings</h2>
                <button id="settings-close" aria-label="Close settings">✕</button>
            </div>

            <div class="settings-section">
                <h3>Account</h3>
                <p class="settings-row">Signed in as <strong id="settings-username"></strong></p>
            </div>

            <!-- the delete account button goes here later -->
        </div>
    </div>
    <script src="/static/library.js"></script>
</body>
</html>
