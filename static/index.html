<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loop Player</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <div class="form-side">
            <div class="form-card">
                <div class="logo-mark">
                    <img src="/static/music_player_icon.png" alt="Logo">
                </div>
                <h1>Welcome back!</h1>

                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">

                <button id="login-btn" class="primary-btn">Log in</button>
                <button id="register-btn" class="secondary-btn">Register instead</button>

                <p id="auth-message" class="message"></p>
            </div>
        </div>
        <div class="art-side"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
